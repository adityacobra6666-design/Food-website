<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>🍔 Food Ordering System</h1>

    <div class="box">

        <h2>Login</h2>

        <br>

        <form action="/login" method="POST">

            <input
                type="text"
                name="user"
                id="user"
                placeholder="Username"
                required>

            <input
                type="password"
                name="pass"
                id="pass"
                placeholder="Password"
                required>

            <button type="submit">

                Login

            </button>

        </form>

        <br>

        <p id="msg"></p>

        <br>

        <h3>Demo Login</h3>

        <p>
            Username : <b>admin</b>
        </p>

        <p>
            Password : <b>1234</b>
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
